  <body>
    <main id="demo">
      <noscript>
        <h1>Readout</h1>
        <p>
          An FFGL effect that gives every row of the frame its own moment in
          time, the way a CMOS sensor does. Skew, jello, flash banding and the
          striping from a mains-driven lamp then all come from one sample window
          applied to four different things.
        </p>
        <p>
          This demo runs the plugin's shaders in your browser, so it needs
          JavaScript and WebGL2. The plugin itself, its source and its downloads
          are on
          <a href="https://github.com/stoatworks-labs/readout">its repository</a>.
        </p>
        <ul>
          <li><a href="https://stoatworks-labs.com/software/readout/">Project page and downloads</a></li>
          <li><a href="https://github.com/stoatworks-labs/readout">Source on GitHub</a></li>
        </ul>
      </noscript>
    </main>
